<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cameron davis ~ the city</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="public/website_pfp.png" type="image/png" />
    <style>
      /* page-specific: the sketched city scene (font + footer come from styles.css) */
      body {
        background: #f3efe4; /* warm paper */
      }
      .city-wrap {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 1.5rem 1rem 0;
      }
      .city-title {
        text-align: center;
        font-size: 1.5rem;
        letter-spacing: 0.1em;
      }
      .city-hint {
        text-align: center;
        font-size: 0.8rem;
        opacity: 0.6;
        margin-top: 0.25rem;
      }
      /* hand-drawn ink defaults for the whole scene */
      #skyline {
        display: block;
        width: 100%;
        height: auto;
      }
      .ink {
        fill: none;
        stroke: #2b2b2b;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pane {
        fill: #f8f5ec; /* faint window fill so buildings read as solid */
      }
      .label {
        fill: #2b2b2b;
        font-family: "Courier New", Courier, monospace;
        font-size: 22px;
        text-anchor: middle;
      }
      /* each building is a link; gentle, non-traversal hover feedback only */
      .lot {
        cursor: pointer;
        transition: transform 0.15s ease-out;
      }
      .lot .pane {
        transition: fill 0.15s ease-out;
      }
      .lot:hover {
        transform: translateY(-6px);
      }
      .lot:hover .pane {
        fill: #e7c8a0; /* warm terracotta wash on hover */
      }
    </style>
  </head>
  <body style="font-family: 'Courier New', Courier, monospace">
    <main class="city-wrap">
      <h1 class="city-title">the city</h1>
      <p class="city-hint">~ wander a building to enter ~</p>

      <!--
        Static, link-only city. The #sketch filter (feTurbulence + feDisplacementMap)
        wobbles every straight edge so the whole scene reads as hand-drawn.
        Each .lot group is wrapped in a plain <a href> — navigation is ordinary links.
      -->
      <svg
        id="skyline"
        viewBox="0 0 1400 620"
        preserveAspectRatio="xMidYMax meet"
        role="navigation"
        aria-label="city of pages"
      >
        <defs>
          <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.018"
              numOctaves="3"
              seed="7"
              result="noise"
            />
            <feDisplacementMap
              in="SourceGraphic"
              in2="noise"
              scale="5"
              xChannelSelector="R"
              yChannelSelector="G"
            />
          </filter>
        </defs>

        <g filter="url(#sketch)">
          <!-- sky decor -->
          <circle class="ink" cx="1230" cy="110" r="46" />
          <path class="ink" d="M150 110 q30 -34 64 0 q34 -20 50 6" />
          <path class="ink" d="M470 78 q26 -28 56 0 q30 -18 44 6" />

          <!-- street -->
          <path class="ink" d="M30 560 L1370 560" />
          <path class="ink" d="M120 580 L260 580 M360 580 L520 580 M620 580 L800 580 M900 580 L1080 580 M1180 580 L1320 580" stroke-width="1.6" />

          <!-- buildings: each <a> + .lot group is a single link -->

          <a href="work.html" aria-label="work experience">
            <g class="lot">
              <rect class="ink pane" x="70" y="250" width="170" height="310" />
              <line class="ink" x1="70" y1="300" x2="240" y2="300" />
              <rect class="ink pane" x="100" y="330" width="40" height="40" />
              <rect class="ink pane" x="170" y="330" width="40" height="40" />
              <rect class="ink pane" x="135" y="500" width="40" height="60" />
              <text class="label" x="155" y="290">work</text>
            </g>
          </a>

          <a href="websites.html" aria-label="websites">
            <g class="lot">
              <rect class="ink pane" x="290" y="180" width="160" height="380" />
              <rect class="ink pane" x="320" y="220" width="36" height="36" />
              <rect class="ink pane" x="384" y="220" width="36" height="36" />
              <rect class="ink pane" x="320" y="290" width="36" height="36" />
              <rect class="ink pane" x="384" y="290" width="36" height="36" />
              <rect class="ink pane" x="350" y="500" width="40" height="60" />
              <text class="label" x="370" y="170">sites</text>
            </g>
          </a>

          <a href="people.html" aria-label="people who inspire">
            <g class="lot">
              <path class="ink pane" d="M500 560 L500 300 L585 250 L670 300 L670 560 Z" />
              <rect class="ink pane" x="535" y="340" width="40" height="40" />
              <rect class="ink pane" x="595" y="340" width="40" height="40" />
              <rect class="ink pane" x="565" y="500" width="40" height="60" />
              <text class="label" x="585" y="230">people</text>
            </g>
          </a>

          <a href="words.html" aria-label="words that inspire">
            <g class="lot">
              <rect class="ink pane" x="720" y="320" width="150" height="240" />
              <line class="ink" x1="720" y1="370" x2="870" y2="370" />
              <line class="ink" x1="720" y1="420" x2="870" y2="420" />
              <rect class="ink pane" x="775" y="500" width="40" height="60" />
              <text class="label" x="795" y="310">words</text>
            </g>
          </a>

          <a href="future/" aria-label="the future ~ personal writings">
            <g class="lot">
              <rect class="ink pane" x="920" y="150" width="170" height="410" />
              <line class="ink" x1="1005" y1="150" x2="1005" y2="560" stroke-width="1.4" />
              <rect class="ink pane" x="945" y="200" width="32" height="32" />
              <rect class="ink pane" x="1033" y="200" width="32" height="32" />
              <rect class="ink pane" x="945" y="270" width="32" height="32" />
              <rect class="ink pane" x="1033" y="270" width="32" height="32" />
              <rect class="ink pane" x="985" y="500" width="40" height="60" />
              <text class="label" x="1005" y="140">future</text>
            </g>
          </a>

          <a
            href="https://github.com/cameron-d28"
            aria-label="github profile"
          >
            <g class="lot">
              <rect class="ink pane" x="1150" y="300" width="150" height="260" />
              <rect class="ink pane" x="1185" y="340" width="36" height="36" />
              <rect class="ink pane" x="1245" y="340" width="36" height="36" />
              <rect class="ink pane" x="1205" y="500" width="40" height="60" />
              <text class="label" x="1225" y="290">github</text>
            </g>
          </a>

          <!-- about: foreground street sign on a post -->
          <a href="resume.html" aria-label="about / resume">
            <g class="lot">
              <line class="ink" x1="420" y1="560" x2="420" y2="470" />
              <rect class="ink pane" x="350" y="420" width="140" height="54" />
              <text class="label" x="420" y="456" font-size="20">about</text>
            </g>
          </a>
        </g>
      </svg>
    </main>

    <footer>
      <a href="https://jeffhuang.com/designed_to_last/"
        >building pages to last</a
      >
    </footer>
  </body>
</html>
